[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "item-quality"
version = "0.1.0"
description = "Flags item master records that may need cleanup and produces review candidates for a data steward."
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
item-quality = "item_quality.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
indent-width = 2  # display width of a tab, used for line-length checks

[tool.ruff.format]
indent-style = "tab"
